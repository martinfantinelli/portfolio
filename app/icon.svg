<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>

  <!-- Orange accent bar — top-left corner mark -->
  <rect x="6" y="6" width="8" height="1.5" rx="0.75" fill="#ff7a54"/>

  <!-- Initials: m f in monospace style -->
  <!-- m: two humps -->
  <path d="M6 22 L6 14 L9.5 18.5 L13 14 L13 22" stroke="#f0ede8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- f: vertical + two horizontals -->
  <path d="M17 22 L17 13.5 Q17 12 18.5 12 L20 12" stroke="#f0ede8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="17" y1="17" x2="20.5" y2="17" stroke="#f0ede8" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Orange dot — bottom right -->
  <circle cx="25.5" cy="25.5" r="1.5" fill="#ff7a54"/>
</svg>
